<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review | WDD 131</title>
    <meta name="description" content="Submit a product review using this WDD 131 product review form.">
    <meta name="author" content="Mercy Mbungu">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <script src="scripts/getdates.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form action="review.html" method="get">
            <div class="form-group">
                <label for="productName">Product Name <span class="required">*</span></label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <fieldset class="form-group">
                <legend>Overall Rating <span class="required">*</span></legend>
                <div class="rating">
                    <label class="rating-option" for="rating1">
                        <span aria-hidden="true">&star;</span>
                        <input type="radio" id="rating1" name="rating" value="1" required>
                    </label>
                    <label class="rating-option" for="rating2">
                        <span aria-hidden="true">&star;&star;</span>
                        <input type="radio" id="rating2" name="rating" value="2" required>
                    </label>
                    <label class="rating-option" for="rating3">
                        <span aria-hidden="true">&star;&star;&star;</span>
                        <input type="radio" id="rating3" name="rating" value="3" required>
                    </label>
                    <label class="rating-option" for="rating4">
                        <span aria-hidden="true">&star;&star;&star;&star;</span>
                        <input type="radio" id="rating4" name="rating" value="4" required>
                    </label>
                    <label class="rating-option" for="rating5">
                        <span aria-hidden="true">&star;&star;&star;&star;&star;</span>
                        <input type="radio" id="rating5" name="rating" value="5" required>
                    </label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="installDate">Date of Installation <span class="required">*</span></label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <fieldset class="form-group">
                <legend>Which features did you find useful in the product?<br>(Check all that apply)</legend>
                <div class="checkbox-list">
                    <label for="featureDurability">
                        <input type="checkbox" id="featureDurability" name="features" value="durability">
                        Durability
                    </label>
                    <label for="featureEase">
                        <input type="checkbox" id="featureEase" name="features" value="ease-of-use">
                        Ease of Use
                    </label>
                    <label for="featurePerformance">
                        <input type="checkbox" id="featurePerformance" name="features" value="performance">
                        Performance
                    </label>
                    <label for="featureDesign">
                        <input type="checkbox" id="featureDesign" name="features" value="design">
                        Design
                    </label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="review">Written Review <span class="optional">(Optional)</span></label>
                <textarea id="review" name="review" rows="5"></textarea>
            </div>

            <div class="form-group">
                <label for="userName">Your Name <span class="optional">(Optional)</span></label>
                <input type="text" id="userName" name="userName" autocomplete="name">
            </div>

            <input type="submit" value="Post Review">
        </form>
    </main>

    <footer>
        <p>&copy;<span id="currentYear"></span> Mercy Mbungu</p>
        <p>Kinshasa, DR Congo</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
